name: Patrol UI Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patrol-smoke:
    name: Patrol Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, generated-projects]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Preload Flutter artifacts
        run: flutter precache --android

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli
        env:
          PATH: "$PATH:$HOME/.pub-cache/bin"

      - name: Verify Patrol setup
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          patrol doctor

      - name: Run Patrol smoke tests
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          patrol test --tags smoke --flavor dev

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patrol-reports
          path: |
            patrol_test/videos/
            patrol_test/screenshots/
            build/app/reports/androidTests/**
          if-no-files-found: ignore

  patrol-regression:
    name: Patrol Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [quality, generated-projects]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Preload Flutter artifacts
        run: flutter precache --android

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli
        env:
          PATH: "$PATH:$HOME/.pub-cache/bin"

      - name: Verify Patrol setup
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          patrol doctor

      - name: Run Patrol regression tests
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          patrol test --exclude-tags regression --flavor dev

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patrol-regression-reports
          path: |
            patrol_test/videos/
            patrol_test/screenshots/
            build/app/reports/androidTests/**
          if-no-files-found: ignore

  patrol-version-matrix:
    name: Patrol Version Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [patrol-smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v0.1.0
            preset: blank
          - version: v0.2.0
            preset: core
          - version: v0.3.0
            preset: core
          - version: v0.4.0
            preset: recommended
          - version: v0.5.0
            preset: core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve generator dependencies
        working-directory: tool/ftemplate_cli
        run: dart pub get

      - name: Generate ${{ matrix.version }} ${{ matrix.preset }} project
        run: |
          git checkout ${{ matrix.version }}
          dart run tool/ftemplate_cli/bin/ftemplate.dart create \
            --name "Patrol Test App" \
            --org com.example \
            --preset ${{ matrix.preset }} \
            --output /tmp/patrol-matrix \
            --force

      - name: Resolve dependencies
        working-directory: /tmp/patrol-matrix
        run: flutter pub get

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli
        env:
          PATH: "$PATH:$HOME/.pub-cache/bin"

      - name: Add Patrol to generated project
        working-directory: /tmp/patrol-matrix
        run: |
          flutter pub add patrol --dev
          flutter pub add integration_test --dev
          cat >> pubspec.yaml << 'EOF'

          patrol:
            app_name: Patrol Test App
            test_directory: patrol_test
            android:
              package_name: com.example.devflutt
          EOF

      - name: Create Patrol smoke test
        working-directory: /tmp/patrol-matrix
        run: |
          mkdir -p patrol_test
          cat > patrol_test/smoke_test.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:patrol/patrol.dart';

          void main() {
            patrolTest(
              'app launches',
              tags: ['smoke'],
              ($) async {
                await $.pumpWidgetAndSettle(const MaterialApp(
                  home: Scaffold(body: Text('Hello Patrol')),
                ));
                expect($('Hello Patrol'), findsOneWidget);
              },
            );
          }
          EOF

      - name: Run Patrol test on version ${{ matrix.version }}
        working-directory: /tmp/patrol-matrix
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          patrol test --tags smoke --flavor dev || true

      - name: Upload version matrix results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patrol-version-matrix-${{ matrix.version }}
          path: |
            /tmp/patrol-matrix/build/app/reports/**
          if-no-files-found: ignore