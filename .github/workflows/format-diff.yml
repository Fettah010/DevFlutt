name: Format diff

on:
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
      - run: flutter pub get
      - run: dart format .
      - run: git --no-pager diff -- lib/ test/
