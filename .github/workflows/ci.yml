name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Upload lockfile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pubspec-lock
          path: pubspec.lock

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: build/verify-logs/
          if-no-files-found: ignore

  generator:
    name: Generator package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve generator dependencies
        working-directory: tool/ftemplate_cli
        run: dart pub get --enforce-lockfile

      - name: Check formatting
        working-directory: tool/ftemplate_cli
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze generator
        working-directory: tool/ftemplate_cli
        run: dart analyze --fatal-infos

      - name: Run generator tests
        working-directory: tool/ftemplate_cli
        run: dart test

  generated-project-matrix:
    name: Validate generated-project matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.emit.outputs.include }}
      count: ${{ steps.emit.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Validate and enumerate required cases
        id: emit
        run: dart tool/verify/generated_project_matrix.dart --github-output "$GITHUB_OUTPUT"

  generated-projects:
    name: Generated project ${{ matrix.name }}
    needs: generated-project-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generated-project-matrix.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION=28.2.13676358
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root is not configured." >&2
            exit 1
          fi
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"
          for attempt in 1 2 3; do
            if sdkmanager --install "ndk;$NDK_VERSION"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Failed to install Android NDK $NDK_VERSION after $attempt attempts." >&2
              exit 1
            fi
            echo "NDK installation attempt $attempt failed; retrying after a short delay." >&2
            sleep "$((attempt * 15))"
          done
          if ! grep -Fxq "Pkg.Revision = $NDK_VERSION" "$NDK_DIR/source.properties"; then
            echo "Installed Android NDK does not match expected version $NDK_VERSION." >&2
            exit 1
          fi

      - name: Resolve generator dependencies
        working-directory: tool/ftemplate_cli
        run: dart pub get --enforce-lockfile

      - name: Generate ${{ matrix.name }} project
        env:
          CASE_NAME: ${{ matrix.name }}
          PRESET: ${{ matrix.preset }}
          AUTH: ${{ matrix.auth }}
          BACKEND: ${{ matrix.backend }}
          MODULES_JSON: ${{ toJSON(matrix.modules) }}
        run: |
          set -euo pipefail
          MODULE_ARGS=()
          while IFS= read -r module; do
            [[ -z "$module" ]] || MODULE_ARGS+=(--module "$module")
          done < <(jq -r '.[]' <<< "$MODULES_JSON")
          dart run tool/ftemplate_cli/bin/ftemplate.dart create \
            --name "Generated App" \
            --org com.example \
            --preset "$PRESET" \
            --auth "$AUTH" \
            --backend "$BACKEND" \
            "${MODULE_ARGS[@]}" \
            --output "/tmp/generated-$CASE_NAME" \
            --force

      - name: Resolve dependencies
        working-directory: /tmp/generated-${{ matrix.name }}
        run: flutter pub get

      - name: Generate localization API
        if: matrix.preset == 'full' || contains(matrix.modules, 'localization')
        working-directory: /tmp/generated-${{ matrix.name }}
        run: flutter gen-l10n

      - name: Check formatting
        working-directory: /tmp/generated-${{ matrix.name }}
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: /tmp/generated-${{ matrix.name }}
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: /tmp/generated-${{ matrix.name }}
        run: |
          set -euo pipefail
          flutter test --reporter=json > test-events.json
          dart "$GITHUB_WORKSPACE/tool/verify/generated_project_matrix.dart" \
            --check-test-results test-events.json

      - name: Build debug APK
        working-directory: /tmp/generated-${{ matrix.name }}
        run: flutter build apk --debug --flavor dev

      - name: Build release APK
        working-directory: /tmp/generated-${{ matrix.name }}
        run: flutter build apk --release --flavor prod

      - name: Review release manifest permissions and components
        working-directory: /tmp/generated-${{ matrix.name }}
        env:
          PRESET: ${{ matrix.preset }}
          MODULES_JSON: ${{ toJSON(matrix.modules) }}
        run: |
          set -euo pipefail
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          APK=build/app/outputs/flutter-apk/app-prod-release.apk
          if [ ! -f "$APK" ]; then
            echo "The release APK was not found at $APK."
            exit 1
          fi
          "$AAPT2" dump permissions "$APK" > release-permissions.log
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > release-components.log
          cat release-permissions.log
          if [ "${{ matrix.expects_network }}" = "true" ]; then
            if ! grep -q "android.permission.INTERNET" release-permissions.log; then
              echo "The selection has a network client, but the release manifest does not request the INTERNET permission, so the release build cannot reach the network."
              exit 1
            fi
          else
            if grep -q "android.permission.INTERNET" release-permissions.log; then
              echo "The release manifest requests the INTERNET permission, but the selection has no network client."
              exit 1
            fi
          fi
          if [ "${{ matrix.expects_notifications }}" = "true" ]; then
            if ! grep -q "android.permission.POST_NOTIFICATIONS" release-permissions.log; then
              echo "The local-notifications selection does not request POST_NOTIFICATIONS."
              exit 1
            fi
          else
            if grep -q "android.permission.POST_NOTIFICATIONS" release-permissions.log; then
              echo "The selection does not include local-notifications but requests POST_NOTIFICATIONS."
              exit 1
            fi
          fi
          if [ "${{ matrix.expects_notifications }}" = "true" ]; then
            if ! grep -q "android.permission.VIBRATE" release-permissions.log; then
              echo "The local-notifications selection does not request VIBRATE."
              exit 1
            fi
          elif grep -q "android.permission.VIBRATE" release-permissions.log; then
            echo "The selection does not include local-notifications but requests VIBRATE."
            exit 1
          fi
          HAS_BACKGROUND_WORK=false
          if [ "$PRESET" = "full" ] || jq -e 'index("background-work") != null' <<< "$MODULES_JSON" >/dev/null; then
            HAS_BACKGROUND_WORK=true
          fi
          if [ "$HAS_BACKGROUND_WORK" = "true" ]; then
            if ! grep -q "androidx.work.impl.background.systemjob.SystemJobService" release-components.log; then
              echo "The background-work selection is missing the WorkManager job service."
              exit 1
            fi
            if grep -Eq "android.permission.FOREGROUND_SERVICE(_SHORT_SERVICE)?" release-permissions.log; then
              echo "The background-work adapter does not expose foreground work and must not request foreground-service permissions."
              exit 1
            fi
          elif grep -q "androidx.work.impl.background.systemjob.SystemJobService" release-components.log; then
            echo "The release manifest includes a WorkManager service without the background-work module."
            exit 1
          fi

      - name: Upload generated project reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-${{ matrix.name }}-reports
          path: |
            /tmp/generated-${{ matrix.name }}/test-events.json
            /tmp/generated-${{ matrix.name }}/release-permissions.log
            /tmp/generated-${{ matrix.name }}/release-components.log
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          EXPECTED="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSLo "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          echo "${EXPECTED}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the repository history
        run: |
          set -euo pipefail
          mkdir -p build/verify-logs
          gitleaks git --redact --verbose \
            --report-format json \
            --report-path build/verify-logs/gitleaks.json \
            . | tee build/verify-logs/gitleaks.log

      - name: Upload the secret-scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secret-scan-report
          path: build/verify-logs/gitleaks.json
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve generator dependencies
        working-directory: tool/ftemplate_cli
        run: dart pub get --enforce-lockfile

      - name: Resolve optional module dependency audit graph
        working-directory: tool/module_dependency_audit
        run: flutter pub get --enforce-lockfile

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          VERSION=2.7.0
          EXPECTED="160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
          curl -sSLo osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64"
          echo "${EXPECTED}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan the lockfiles
        run: |
          set -euo pipefail
          mkdir -p build/verify-logs
          osv-scanner scan \
            --lockfile=pubspec.lock \
            --lockfile=tool/ftemplate_cli/pubspec.lock \
            --lockfile=tool/module_dependency_audit/pubspec.lock \
            --format=json > build/verify-logs/osv-scanner.json
          cat build/verify-logs/osv-scanner.json

      - name: Upload the dependency-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-report
          path: build/verify-logs/osv-scanner.json
          if-no-files-found: ignore

  license-inventory:
    name: Licence inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Resolve generator dependencies
        working-directory: tool/ftemplate_cli
        run: dart pub get --enforce-lockfile

      - name: Resolve optional module dependency audit graph
        working-directory: tool/module_dependency_audit
        run: flutter pub get --enforce-lockfile

      - name: Check the third-party notices
        run: dart run tool/ftemplate_cli/tool/license_inventory.dart --check

  android-build:
    name: Android debug and release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        run: flutter build apk --debug --flavor dev

      - name: Build release APK
        run: flutter build apk --release --flavor prod

      - name: Verify release permissions are blank
        run: |
          mkdir -p build/verify-logs
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-prod-release.apk \
            | tee build/verify-logs/release-permissions.txt
          if "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-prod-release.apk \
            | grep -q "android.permission.INTERNET"; then
            echo "ERROR: release APK must not request INTERNET" >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-dev-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-prod-release.apk

      - name: Upload permission report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-permissions
          path: build/verify-logs/release-permissions.txt
          if-no-files-found: ignore
