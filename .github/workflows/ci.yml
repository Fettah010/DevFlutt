name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Upload lockfile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pubspec-lock
          path: pubspec.lock

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: build/verify-logs/
          if-no-files-found: ignore

  generator:
    name: Generator package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Resolve generator dependencies
        working-directory: tool/ftemplate_cli
        run: dart pub get

      - name: Show formatting changes
        working-directory: tool/ftemplate_cli
        run: |
          dart format .
          git --no-pager diff -- . || true

      - name: Check formatting
        working-directory: tool/ftemplate_cli
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze generator
        working-directory: tool/ftemplate_cli
        run: dart analyze --fatal-infos

      - name: Run generator tests
        working-directory: tool/ftemplate_cli
        run: dart test

  android-build:
    name: Android debug and release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release permissions are blank
        run: |
          mkdir -p build/verify-logs
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk \
            | tee build/verify-logs/release-permissions.txt
          if "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk \
            | grep -q "android.permission.INTERNET"; then
            echo "ERROR: release APK must not request INTERNET" >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload permission report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-permissions
          path: build/verify-logs/release-permissions.txt
          if-no-files-found: ignore
