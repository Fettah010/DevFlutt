id: auth-supabase
version: 1
category: auth
summary: >-
  Authentication adapter for Supabase Auth, with email and password sign-in,
  one-time-password sign-in, a secure-storage-backed session, and provider-managed
  token refresh.
requires:
  - auth-core
conflictsWith:
  - auth-rest
  - auth-firebase
platforms:
  - android
  - ios
pubDependencies:
  - name: supabase_flutter
    version: ^2.18.3
nativeChanges:
  android: []
  ios: []
permissions: []
configKeys: []
privacy:
  network: true
  telemetry: false
capabilities:
  - email-password-sign-in
  - email-password-registration
  - password-reset
  - session-restoration
  - token-refresh
  - logout
  - one-time-password-sign-in
outputs:
  - lib/core/auth/supabase/fake_supabase_auth_port.dart
  - lib/core/auth/supabase/secure_storage_local_storage.dart
  - lib/core/auth/supabase/supabase_auth_adapter.dart
  - lib/core/auth/supabase/supabase_auth_port.dart
  - lib/core/auth/supabase/supabase_auth_port_impl.dart
  - lib/core/auth/supabase/supabase_config.dart
requiredSetup:
  - The module adds no permission and no configuration key.
  - The shipped configuration file holds an inert project URL and publishable key.
    Replace them with the values from your Supabase project settings.
  - The session is persisted through the secure store of the secure-storage module, not
    through the package's shared_preferences default, so the refresh token is not
    written to an unencrypted, auto-backed-up file.
  - One-time-password sign-in, password reset, and any OAuth provider need a deep link.
    Add the link to the Android manifest and allow the redirect in the Supabase
    dashboard. The module does not guess a scheme for you.
  - The provider owns password policy, multi-factor authentication, account recovery,
    and session revocation.
tests:
  unit: true
  widget: false
  integration: none
