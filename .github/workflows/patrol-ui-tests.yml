name: Patrol UI Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patrol-ui:
    name: Patrol UI tests (Android API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Resolve generator dependencies
        working-directory: tool/ftemplate_cli
        run: dart pub get

      - name: Install pinned Patrol CLI
        run: dart pub global activate patrol_cli 4.8.0

      - name: Add Dart tools to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Enable Android emulator hardware acceleration
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "This runner does not expose /dev/kvm; refusing a ten-minute software-emulator boot." >&2
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Prepare Android emulator and run Patrol suites
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-linux-hw-accel: false
          disable-animations: true
          script: |
            adb devices -l
            dart run tool/patrol/run.dart --suite smoke
            dart run tool/patrol/run.dart --suite regression
            mkdir -p build/patrol-logs
            trap 'if ! adb -s emulator-5554 logcat -d -v threadtime > "$GITHUB_WORKSPACE/build/patrol-logs/platform-services-logcat.txt"; then echo "Could not capture platform-service emulator logcat." >&2; fi' EXIT
            dart run tool/ftemplate_cli/bin/ftemplate.dart create --name "Platform Services CI Smoke" --org com.example --preset blank --module background-work --module local-notifications --module app-updates --output "$RUNNER_TEMP/devflutt-platform-services-smoke" --no-pub
            cd "$RUNNER_TEMP/devflutt-platform-services-smoke"
            flutter pub get
            flutter build apk --debug --flavor dev
            apk=build/app/outputs/flutter-apk/app-dev-debug.apk
            aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
            test -n "$aapt"
            package_id=$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            user_id=$(adb -s emulator-5554 shell am get-current-user | tr -d '\r')
            test -n "$package_id" && test -n "$user_id"
            adb -s emulator-5554 install --user "$user_id" -r "$apk"
            if ! adb -s emulator-5554 shell pm list packages --user "$user_id" | grep -Fx "package:$package_id"; then
              echo "Generated app package $package_id is not installed for Android user $user_id." >&2
              adb -s emulator-5554 shell pm list packages --user "$user_id" >&2
              exit 1
            fi
            adb -s emulator-5554 shell pm revoke --user "$user_id" "$package_id" android.permission.POST_NOTIFICATIONS
            flutter drive --no-dds --driver=test_driver/integration_test.dart --target=integration_test/platform_services_test.dart -d emulator-5554 --flavor dev
            adb -s emulator-5554 install --user "$user_id" -r "$apk"
            adb -s emulator-5554 shell pm grant --user "$user_id" "$package_id" android.permission.POST_NOTIFICATIONS
            flutter drive --no-dds --driver=test_driver/integration_test.dart --target=integration_test/platform_services_test.dart -d emulator-5554 --flavor dev --dart-define=DEVFLUTT_EXPECT_NOTIFICATIONS_GRANTED=true

      - name: Upload Patrol diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patrol-ui-diagnostics
          path: |
            build/patrol-logs/**
            build/app/reports/androidTests/**
            build/app/test-results/**
            patrol_test/screenshots/**
            patrol_test/videos/**
          if-no-files-found: warn
