name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Upload lockfile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pubspec-lock
          path: pubspec.lock

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: build/verify-logs/
          if-no-files-found: ignore

  generator:
    name: Generator package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve generator dependencies
        working-directory: tool/ftemplate_cli
        run: dart pub get

      - name: Check formatting
        working-directory: tool/ftemplate_cli
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze generator
        working-directory: tool/ftemplate_cli
        run: dart analyze --fatal-infos

      - name: Run generator tests
        working-directory: tool/ftemplate_cli
        run: dart test

  generated-projects:
    name: Generated project matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: blank
            preset: blank
            auth: none
          - name: core
            preset: core
            auth: none
          - name: demo
            preset: demo
            auth: none
          - name: recommended
            preset: recommended
            auth: none
          - name: auth-rest
            preset: core
            auth: rest
          - name: auth-firebase
            preset: core
            auth: firebase
          - name: auth-supabase
            preset: core
            auth: supabase
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve generator dependencies
        working-directory: tool/ftemplate_cli
        run: dart pub get

      - name: Generate ${{ matrix.name }} project
        run: |
          dart run tool/ftemplate_cli/bin/ftemplate.dart create \
            --name "Generated App" \
            --org com.example \
            --preset ${{ matrix.preset }} \
            --auth ${{ matrix.auth }} \
            --output /tmp/generated-${{ matrix.name }} \
            --force

      - name: Resolve dependencies
        working-directory: /tmp/generated-${{ matrix.name }}
        run: flutter pub get

      - name: Check formatting
        working-directory: /tmp/generated-${{ matrix.name }}
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: /tmp/generated-${{ matrix.name }}
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: /tmp/generated-${{ matrix.name }}
        run: flutter test

      - name: Build debug APK
        working-directory: /tmp/generated-${{ matrix.name }}
        run: flutter build apk --debug --flavor dev

      - name: Build release APK
        if: matrix.auth != 'none'
        working-directory: /tmp/generated-${{ matrix.name }}
        run: flutter build apk --release --flavor prod

      - name: Review the release manifest permissions
        if: matrix.auth != 'none'
        working-directory: /tmp/generated-${{ matrix.name }}
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions app/build/outputs/flutter-apk/app-prod-release.apk \
            > release-permissions.log
          cat release-permissions.log
          if grep -q "android.permission.INTERNET" release-permissions.log; then
            echo "The release manifest requests the INTERNET permission without a reason."
            exit 1
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          EXPECTED="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSLo "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          echo "${EXPECTED}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the repository history
        run: |
          set -euo pipefail
          mkdir -p build/verify-logs
          gitleaks git --redact --verbose \
            --report-format json \
            --report-path build/verify-logs/gitleaks.json \
            . | tee build/verify-logs/gitleaks.log

      - name: Upload the secret-scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secret-scan-report
          path: build/verify-logs/gitleaks.json
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve generator dependencies
        working-directory: tool/ftemplate_cli
        run: dart pub get

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          VERSION=2.7.0
          EXPECTED="160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
          curl -sSLo osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64"
          echo "${EXPECTED}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan the lockfiles
        run: |
          set -euo pipefail
          mkdir -p build/verify-logs
          osv-scanner scan \
            --lockfile=pubspec.lock \
            --lockfile=tool/ftemplate_cli/pubspec.lock \
            --format=json > build/verify-logs/osv-scanner.json
          cat build/verify-logs/osv-scanner.json

      - name: Upload the dependency-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-report
          path: build/verify-logs/osv-scanner.json
          if-no-files-found: ignore

  license-inventory:
    name: Licence inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Resolve generator dependencies
        working-directory: tool/ftemplate_cli
        run: dart pub get

      - name: Check the third-party notices
        run: dart run tool/ftemplate_cli/tool/license_inventory.dart --check

  android-build:
    name: Android debug and release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --flavor dev

      - name: Build release APK
        run: flutter build apk --release --flavor prod

      - name: Verify release permissions are blank
        run: |
          mkdir -p build/verify-logs
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-prod-release.apk \
            | tee build/verify-logs/release-permissions.txt
          if "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-prod-release.apk \
            | grep -q "android.permission.INTERNET"; then
            echo "ERROR: release APK must not request INTERNET" >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-dev-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-prod-release.apk

      - name: Upload permission report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-permissions
          path: build/verify-logs/release-permissions.txt
          if-no-files-found: ignore
