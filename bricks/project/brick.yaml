name: project
description: Base Flutter project scaffold for the DevFlutt template.
version: 0.3.0+1
vars:
  projectName:
    type: string
    description: Dart package identifier.
  projectDescription:
    type: string
    description: Human-facing application description.
  org:
    type: string
    description: Reverse-domain organization.
  applicationId:
    type: string
    description: Android application ID.
  packagePath:
    type: string
    description: Application ID with dots replaced by slashes.
  hasArchitectureCore:
    type: boolean
    description: Include the core architecture (config, theme, bootstrap).
    default: true
  hasStateRiverpod:
    type: boolean
    description: Include the Riverpod provider scope.
    default: false
  hasGoRouter:
    type: boolean
    description: Include the go_router router.
    default: false
  hasDesignSystem:
    type: boolean
    description: Include the reusable core widgets.
    default: false
  hasFeatureExample:
    type: boolean
    description: Include the counter feature example.
    default: false
  hasShowcase:
    type: boolean
    description: Include the component showcase page.
    default: false
  hasLogging:
    type: boolean
    description: Include the structured, redacted logger.
    default: false
  hasNetworking:
    type: boolean
    description: Include the typed HTTP client and its fake adapter.
    default: false
  hasSecureStorage:
    type: boolean
    description: Include the secure key-value store and its Android backup rules.
    default: false
  hasDiagnostics:
    type: boolean
    description: Include the app-owned error reporter and its local adapter.
    default: false
  hasAuthCore:
    type: boolean
    description: Include the provider-neutral authentication contract and session store.
    default: false
  hasAuthRest:
    type: boolean
    description: Include the custom REST/JWT authentication adapter.
    default: false
  hasAuthFirebase:
    type: boolean
    description: Include the Firebase Authentication adapter.
    default: false
  hasAuthSupabase:
    type: boolean
    description: Include the Supabase Auth adapter.
    default: false
  hasAuth:
    type: boolean
    description: Include the selected authentication adapter in the composition root.
    default: false
  hasAuthRouter:
    type: boolean
    description: Wire the authentication redirect into the router guard.
    default: false
  hasNetworkPermission:
    type: boolean
    description: Declare the Android INTERNET permission.
    default: false
  hasServices:
    type: boolean
    description: Include the generated composition root for the selected services.
    default: false
  extraDependencies:
    type: list
    description: Extra pub dependencies as strings.
