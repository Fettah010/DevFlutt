name: devflutt
description: A blank-first Flutter Android app template.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Patrol E2E UI testing (LeanCode)
  patrol: 4.10.0

flutter:
  uses-material-design: true

patrol:
  app_name: DevFlutt
  test_directory: patrol_test
  android:
    package_name: com.example.devflutt
  screenshot_on_failure: true
  emit_test_manifest: true
